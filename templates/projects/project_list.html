{% extends "base.html" %}
{% block content %}
<h2>Projects</h2>
{% if user.role == "LEADER" %}
  <p><a href="{% url 'projects:project_create' %}">+ New Project</a></p>
{% endif %}
<ul>
  {% for project in projects %}
    <li><a href="{% url 'projects:project_detail' project.pk %}">{{ project.name }}</a>
        (Leader: {{ project.owner.username }})</li>
  {% empty %}
    <li>No projects yet.</li>
  {% endfor %}
</ul>
{% endblock %}
