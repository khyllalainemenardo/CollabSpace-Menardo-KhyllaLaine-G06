<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Collab Space{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
    nav { display: flex; gap: 15px; align-items: center; padding: 10px 0; border-bottom: 1px solid #ddd; margin-bottom: 20px; }
    .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
    .alert.success { background: #d4edda; color: #155724; }
    .alert.error { background: #f8d7da; color: #721c24; }
    .errorlist { color: #c0392b; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .column { background: #f4f5f7; padding: 10px; border-radius: 6px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>
    <nav>
    <strong>Collab Space</strong>
    {% if user.is_authenticated %}
      <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
      <span>Hi, {{ user.username }}</span>
      <form method="post" action="{% url 'accounts:logout' %}" style="display:inline; margin:0;">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}">Login</a>
      <a href="{% url 'accounts:register' %}">Register</a>
    {% endif %}
  </nav>

  {% for message in messages %}
    <div class="alert {{ message.tags }}">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</body>
</html>
